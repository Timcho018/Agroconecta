name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias y ejecutar pruebas
        working-directory: backend
        run: |
          uv sync --group dev
          uv run python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Compilar Angular
        working-directory: frontend
        run: npm run build
      - name: Ejecutar pruebas
        working-directory: frontend
        run: npm test -- --watch=false

  deploy-backend:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: render-backend-production
      cancel-in-progress: false
    steps:
      - name: Disparar deploy en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then
            echo "::error::Falta el Repository Secret RENDER_DEPLOY_HOOK_BACKEND"
            exit 1
          fi
          # El hook ya incluye ?key=...; &ref fija el commit que acaba de pasar el CI.
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST "${HOOK}&ref=${GITHUB_SHA}" \
            -o /dev/null
          echo "Deploy solicitado para ${GITHUB_SHA}"
